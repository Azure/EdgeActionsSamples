name: Validate samples

on:
  pull_request:
    paths:
      - "src/edgeactions-js/**"
      - "scripts/build-samples-index.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/build-samples-index.mjs
